version: "3.9"
services:
  hwss_core:
    build:
      context: .
      dockerfile: Dockerfile
    image: hwss_core:v1
    environment:
      - PORT=8000
    env_file:
      - .env
    ports:
      - 8000:8000
    command: sh -c "chmod +x /app/migrate.sh && /app/migrate.sh && /app/entrypoint.sh"
  postgres_db:
    image: postgres
    environment:
      - .env
    expose:
      - 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data: